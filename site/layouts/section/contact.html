{{ define "main" }}

<div class="ph3 bg-off-white pt-awning">
	<div class="center mw6 pv3">

		<img src="{{ .Params.logo }}" alt="{{ .Params.logo_alt }}" class="db w4 center pv4">

		{{ .Content }}

		<div class="mb3 flex-ns">
	        	{{ range .Params.contact_entries }}
				<div class="w-50-ns mb3 mb0-ns">
					<h4 class="f4 b lh-title mb2 primary">{{ .heading }}</h4>
					<div class="pre-line">{{ .text | safeHTML }}</div>
				</div>
			{{ end }}
		</div>

		<div class="mb4">
			<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2682.093245832136!2d-122.20881792351958!3d47.760245671204366!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54900ff7cc1be793%3A0xa2935841d3f8c88!2sSugar%20Rush%20Candy%20Store!5e0!3m2!1sen!2sus!4v1768927903686!5m2!1sen!2sus" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Sugar Rush Candy Store location map"></iframe>
		</div>

		{{ partial "contact-form" . }}

	</div>
</div>

{{ end }}
