<div class="bg-light-blue pv4">
  <div class="ph3 mw7 center">
    <div class="flex-l mhn2-l items-center">
      <div class="{{ if .image }}w-50-l{{ else }}w-40-l{{ end }} ph2-l">
        <h2 class="f2 b lh-title mb2">{{.heading}}</h2>
        <p class="mb0">{{.text}}</p>
      </div>
      {{ with .image }}
      <div class="w-50-l ph2-l">
        <img src="{{ . }}" alt="" class="mb3" loading="lazy">
      </div>
      {{ end }}
    </div>
  </div>
</div>
