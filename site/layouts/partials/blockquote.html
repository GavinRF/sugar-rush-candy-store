<div class="mb3 ph2 w-100 w-50-ns">
	<blockquote class="testimonial-card bg-light-pink primary h-100">
		{{ with .image }}
		<img src="{{ . }}" alt="{{ $.imageAlt }}" class="testimonial-photo" />
		{{ end }}
		<p class="f4 mb3 lh-copy">"{{ .quote }}"</p>
		<cite class="testimonial-author">{{ .author }}</cite>
	</blockquote>
</div>
