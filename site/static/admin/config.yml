backend:
  name: git-gateway
  branch: main

media_folder: "site/static/img" # Folder where user uploaded files should go
public_folder: "img"

collections: # A list of collections the CMS should be able to edit
  - name: "post" # Used in routes, ie.: /admin/collections/:slug/edit
    label: "Post" # Used in the UI, ie.: "New Post"
    folder: "site/content/post" # The path to the folder where the documents are stored
    path: "{{slug}}/index" # Each document is inside a folder with the slug name.
    create: true # Allow users to create new documents in this collection
    fields: # The fields each document in this collection have
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Intro Blurb", name: "description", widget: "text"}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
  - name: "pages"
    label: "Pages"
    files:
      - file: "site/content/_index.md"
        label: "Home Page"
        name: "home"
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Subtitle, name: subtitle, widget: string}
          - {label: Image, name: image, widget: image}
          - {label: "Blurb", name: blurb, widget: object, fields: [
              {label: "Heading", name: "heading", widget: string},
              {label: "Text", name: "text", widget: "text"},
              {label: "Image", name: "image", widget: "image", required: false}]}
          - label: "Info Cards"
            name: info_cards
            widget: object
            fields:
              - label: "Cards"
                name: cards
                widget: list
                fields:
                  - {label: "Icon", name: "icon", widget: "string", hint: "Iconify icon name (e.g. solar:pin-outline)"}
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Text", name: "text", widget: "text", hint: "HTML allowed for formatting. Note: Store Hours are managed separately in Site Settings > Store Hours."}
          - {label: "Intro", name: intro, widget: object, fields: [
              {label: "Heading", name: "heading", widget: string},
              {label: "Text", name: "text", widget: "text"}]}
          - {label: "Products", name: products, widget: list, fields: [
              {label: "Image", name: "image", widget: "image"},
              {label: "Image Alt Text", name: "imageAlt", widget: "string"},
              {label: "Text", name: "text", widget: "text"}]}
          - {label: "Values", name: "values", widget: "object", fields: [
              {label: "Heading", name: "heading", widget: string},
              {label: "Text", name: "text", widget: "text"},
              {label: "Image", name: "image", widget: "image"},
              {label: "Image Alt Text", name: "imageAlt", widget: "string"}]}
          - {label: "Our Story", name: "story", widget: "object", fields: [
              {label: "Heading", name: "heading", widget: string},
              {label: "Text", name: "text", widget: "text"},
              {label: "Image", name: "image", widget: "image"},
              {label: "Image Alt Text", name: "imageAlt", widget: "string"}]}
          - label: "Testimonials"
            name: testimonials
            widget: list
            fields:
              - {label: "Quote", name: "quote", widget: "string"}
              - {label: "Author", name: "author", widget: "string"}
              - {label: "Photo", name: "image", widget: "image", required: false}
              - {label: "Photo Alt Text", name: "imageAlt", widget: "string", required: false}
      - file: "site/content/contact/_index.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Logo, name: logo, widget: image}
          - {label: Logo Alt Text, name: logo_alt, widget: string}
          - {label: Body, name: body, widget: markdown}
          - label: Contact Entries
            name: contact_entries
            widget: list
            fields:
              - label: Heading
                name: heading
                widget: string
              - label: Text
                name: text
                widget: markdown
      - file: "site/content/products/_index.md"
        label: "Products Page"
        name: "products"
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Image, name: image, widget: image}
          - {label: Intro, name: intro, widget: object, fields: [{label: Heading, name: heading, widget: string}, {label: Description, name: description, widget: text}, {label: Blurbs, name: blurbs, widget: list, fields: [{label: Image, name: image, widget: image}, {label: Image Alt Text, name: imageAlt, widget: string}, {label: Text, name: text, widget: text}]}]}
          - {label: Main, name: main, widget: object, fields: [{label: Heading, name: heading, widget: string}, {label: Description, name: description, widget: text}, {label: Image1, name: image1, widget: object, fields: [{label: Image, name: image, widget: image}, {label: Alt, name: alt, widget: string}]}, {label: Image2, name: image2, widget: object, fields: [{label: Image, name: image, widget: image}, {label: Alt, name: alt, widget: string}]}, {label: Image3, name: image3, widget: object, fields: [{label: Image, name: image, widget: image}, {label: Alt, name: alt, widget: string}]}]}
          - {label: Full_image, name: full_image, widget: image}
          - {label: Full Image Alt Text, name: full_image_alt, widget: string}
          - {label: Pricing, name: pricing, widget: object, fields: [{label: Heading, name: heading, widget: string}, {label: Description, name: description, widget: string}, {label: Plans, name: plans, widget: list, fields: [{label: Plan, name: plan, widget: string}, {label: Price, name: price, widget: string}, {label: Description, name: description, widget: string}, {label: Items, name: items, widget: list}]}]}
      - file: "site/content/values/_index.md"
        label: "Values Page"
        name: "values"
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Image, name: image, widget: image}
          - label: Values
            name: values
            widget: list
            fields:
              - {label: Heading, name: heading, widget: string}
              - {label: Text, name: text, widget: text}
              - {label: Image, name: imageUrl, widget: image}
              - {label: Image Alt Text, name: imageAlt, widget: string}
  - name: "site_settings"
    label: "Site Settings"
    files:
      - file: "site/data/footer.json"
        label: Footer
        name: footer
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Blurb, name: blurb, widget: text}
      - file: "site/data/hours.json"
        label: Store Hours
        name: hours
        description: "Edit your store's opening hours here. These appear on the home page and power the 'Open Now' indicator. Use format like '11:00 am' or '7:00 pm'."
        fields:
          - label: Monday
            name: monday
            widget: object
            fields:
              - {label: Closed, name: closed, widget: boolean, default: false}
              - {label: Open, name: open, widget: string, required: false, hint: "e.g. 11:00 am"}
              - {label: Close, name: close, widget: string, required: false, hint: "e.g. 7:00 pm"}
          - label: Tuesday
            name: tuesday
            widget: object
            fields:
              - {label: Closed, name: closed, widget: boolean, default: false}
              - {label: Open, name: open, widget: string, required: false, hint: "e.g. 11:00 am"}
              - {label: Close, name: close, widget: string, required: false, hint: "e.g. 7:00 pm"}
          - label: Wednesday
            name: wednesday
            widget: object
            fields:
              - {label: Closed, name: closed, widget: boolean, default: false}
              - {label: Open, name: open, widget: string, required: false, hint: "e.g. 11:00 am"}
              - {label: Close, name: close, widget: string, required: false, hint: "e.g. 7:00 pm"}
          - label: Thursday
            name: thursday
            widget: object
            fields:
              - {label: Closed, name: closed, widget: boolean, default: false}
              - {label: Open, name: open, widget: string, required: false, hint: "e.g. 11:00 am"}
              - {label: Close, name: close, widget: string, required: false, hint: "e.g. 7:00 pm"}
          - label: Friday
            name: friday
            widget: object
            fields:
              - {label: Closed, name: closed, widget: boolean, default: false}
              - {label: Open, name: open, widget: string, required: false, hint: "e.g. 11:00 am"}
              - {label: Close, name: close, widget: string, required: false, hint: "e.g. 7:00 pm"}
          - label: Saturday
            name: saturday
            widget: object
            fields:
              - {label: Closed, name: closed, widget: boolean, default: false}
              - {label: Open, name: open, widget: string, required: false, hint: "e.g. 11:00 am"}
              - {label: Close, name: close, widget: string, required: false, hint: "e.g. 7:00 pm"}
          - label: Sunday
            name: sunday
            widget: object
            fields:
              - {label: Closed, name: closed, widget: boolean, default: false}
              - {label: Open, name: open, widget: string, required: false, hint: "e.g. 11:00 am"}
              - {label: Close, name: close, widget: string, required: false, hint: "e.g. 7:00 pm"}
      - file: "site/hugo.toml"
        label: Hugo Config
        name: config
        editor:
          preview: false
        fields:
          - {label: Site Title for Browser Tab, name: title, widget: string}
          - label: Params
            name: params
            widget: object
            fields:
              - label: Open Graph Image
                name: images
                widget: list
                field: { label: Image, name: image, widget: image }
